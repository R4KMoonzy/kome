<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF2E00">
  <title>Explorar — MiGuía Local</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css?v=22">
  <link rel="stylesheet" href="css/global.css?v=22">
  <link rel="stylesheet" href="css/pages.css?v=22">
</head>
<body data-page="explorar">
  <div class="page-loader" id="page-loader" aria-hidden="true">
    <div class="page-loader__halo"></div>
    <div class="page-loader__brand">
      <span class="page-loader__logo" id="page-loader-logo"></span>
      <span class="page-loader__name" id="page-loader-name"></span>
      <span class="page-loader__dots"><i></i><i></i><i></i></span>
    </div>
    <div class="page-loader__waves">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave wave--back" d="M0,120 C240,200 480,40 720,120 C960,200 1200,40 1440,120 L1440,320 L0,320 Z"/>
        <path class="wave wave--mid" d="M0,20 C240,100 480,-60 720,20 C960,100 1200,-60 1440,20 L1440,320 L0,320 Z"/>
        <path class="wave wave--front" d="M0,70 C240,-10 480,150 720,70 C960,-10 1200,150 1440,70 L1440,320 L0,320 Z"/>
      </svg>
    </div>
  </div>
  <div id="top-notice" class="top-notice"></div>
  <div id="app-header"></div>
  <div id="app-drawer"></div>

  <main class="page container" id="main">
    <div class="section" style="padding-bottom:12px">
      <h1 class="section__title">Explora el directorio</h1>
      <p class="section__subtitle">Filtra por rubro, zona y disponibilidad. Sin carrito, sin cobros: contactas directo al local.</p>
      <div id="explorar-coverage"></div>
    </div>

    <section style="padding-bottom:10px">
      <div id="explorar-cats"></div>
    </section>

    <section class="section" style="padding-top:10px">
      <div class="filters-bar">
        <span class="filters-bar__label">Filtros</span>
        <input class="input" id="f-q" style="max-width:210px;min-height:38px" placeholder="Buscar local o platillo">
        <select class="filter-select" id="f-cat"></select>
        <select class="filter-select" id="f-zone"></select>
        <button class="chip" id="f-open"><span class="status-dot"></span> Abierto ahora</button>
        <button class="chip" id="f-express">Express propio</button>
        <select class="filter-select" id="f-sort">
          <option value="relevancia">Relevancia</option>
          <option value="rating">Mejor valorados</option>
          <option value="recientes">Más recientes</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
        <button class="chip" id="f-clear">Limpiar</button>
      </div>

      <div class="results-head"><h2>Resultados</h2><span id="results-count">0 locales</span></div>
      <div id="explorar-results"></div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="promo-pill"></div>
  <div id="cookie-bar" class="cookie-bar"></div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="js/icons.js?v=22"></script>
  <script src="js/firebase-config.js?v=22"></script>
  <script src="js/appwrite-config.js?v=22"></script>
  <script src="js/storage-service.js?v=22"></script>
  <script src="js/firestore-service.js?v=22"></script>
  <script src="js/ai-menu-scanner.js?v=22"></script>
  <script src="js/data-service.js?v=22"></script>
  <script src="js/auth-service.js?v=22"></script>
  <script src="js/ui-core.js?v=22"></script>
  <script src="js/page-explorar.js?v=22"></script>
</body>
</html>
